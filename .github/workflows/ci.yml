name: CI

on:
  push:
    branches: [ main, 'chore/**' ]
  pull_request:
    branches: [ main ]

jobs:
  api-server:
    name: API Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./api-server
        run: npm ci

      - name: Run tests
        working-directory: ./api-server
        run: npm test

  vscode-extension:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: ./vscode-extension
        run: npm run compile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (vscode-extension)
        working-directory: ./vscode-extension
        run: npm ci

      - name: Run ESLint (vscode-extension)
        working-directory: ./vscode-extension
        run: npm run lint

      - name: Install dependencies (api-server)
        working-directory: ./api-server
        run: npm ci

      - name: Run ESLint (api-server)
        working-directory: ./api-server
        run: npx eslint .

  quarto-render:
    name: Quarto Render (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `quarto-dev/quarto-actions@v2` no existe: ese repo publica subacciones
      # (`/setup`, `/render`). Se instala con setup y se renderiza con el CLI,
      # que además conserva los argumentos originales tal cual.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render (HTML)
        run: quarto render --no-execute --to html

      - name: Upload HTML book as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-book
          path: _book

  quarto-pdf:
    name: Quarto PDF (attempt)
    runs-on: ubuntu-latest
    needs: quarto-render
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Try PDF render
        run: quarto render --no-execute --to pdf
        continue-on-error: true

      - name: "Fallback: sanitize and re-render if previous step failed"
        if: failure()
        run: |
          chmod +x ./scripts/sanitize-quarto-for-latex.sh
          ./scripts/sanitize-quarto-for-latex.sh

      - name: Upload PDF artifact (if produced)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pdf
          path: _book
